[pytest]
# Add current directory to pythonpath so imports of backend.* work properly
pythonpath = .

# Enable auto-run for async def test functions using pytest-asyncio
asyncio_mode = auto

# Restrict test file matches
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The remaining top-level tests/ files are manual live-service scripts. Some
# perform import-time exits or external actions, so keep them out of the
# deterministic default suite while retaining the real Canvas API tests.
testpaths =
    backend/tests
    tests/test_canvas_engine.py

# Explicitly ignore non-test files and legacy directories that cause collection errors
addopts = --ignore=tests/test_encoding.txt -p no:cacheprovider

# Directories to avoid recursing into
norecursedirs = backend/scratch scratch node_modules .venv env
